<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nifty</title>
<meta name="description" content="Pieces, placed privately. Provenance first. By introduction.">
<meta name="theme-color" content="#F2EEE6">
<meta property="og:title" content="Nifty">
<meta property="og:description" content="Pieces, placed privately. Provenance first.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://niftyinc.io/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23F2EEE6'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='40' text-anchor='middle' fill='%2315130F'%3EN%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--ivory:#F2EEE6;--ink:#15130F;--soft:#7C766B;--line:#D3CCBE;--live:#3E7A4E}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ivory);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative;min-height:100vh}
.frame{position:absolute;inset:18px;border:1px solid var(--line);pointer-events:none}
a{color:inherit;text-decoration:none}
.cap{font-family:'Inter',sans-serif;font-size:8.5px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--soft)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lnk{transition:.25s;cursor:pointer}.lnk:hover{color:var(--ink)}
.sheet{max-width:600px;margin:0 auto;position:relative;padding:56px 46px 48px;min-height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center}
.core{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 0}
.word{font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(46px,13vw,86px);letter-spacing:.2em;text-transform:uppercase;line-height:1;white-space:nowrap;text-indent:.2em}
.sub{margin-top:16px;font-size:8px;letter-spacing:.42em;text-transform:uppercase;color:var(--soft)}
.rule{width:34px;height:1px;background:var(--ink);margin:26px 0 20px;opacity:.55}
.line{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:15.5px;color:#3A362E;line-height:1.65;max-width:24ch}
.hex{margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.2em;color:#A9A294;user-select:all}
.door{margin-top:34px;display:flex;align-items:center;border-bottom:1px solid var(--line);width:100%;max-width:250px;transition:border-color .35s}
.door:focus-within{border-bottom-color:var(--ink)}
.door input{flex:1;background:none;border:0;outline:none;color:var(--ink);font-family:'Inter',sans-serif;font-size:11.5px;letter-spacing:.06em;padding:0 0 9px;text-align:center}
.door input::placeholder{color:#A29B8E;letter-spacing:.16em;text-transform:uppercase;font-size:8.5px}
.door button{background:none;border:0;color:var(--soft);cursor:pointer;font-size:12px;padding:0 0 9px 10px;transition:.25s}
.door button:hover{color:var(--ink);transform:translateX(2px)}
.done{display:none;margin-top:34px;padding-bottom:9px;border-bottom:1px solid var(--ink);font-size:10px;letter-spacing:.22em;text-transform:uppercase;text-align:center}
.done.on{display:block}.door.off{display:none}
.base{display:grid;grid-template-columns:1fr auto auto;gap:24px;align-items:flex-end;border-top:1px solid var(--line);padding-top:14px}
.base .v{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#4C473E;transition:.25s;display:block;margin-top:4px}
.base a.v:hover{color:var(--ink)}.base .r{text-align:right}
.blk{display:flex;align-items:center;gap:5px;justify-content:flex-end}
.dot{width:3.5px;height:3.5px;background:var(--live);border-radius:50%;display:block;animation:p 2.4s ease-in-out infinite}
@keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
.an{opacity:0;transform:translateY(5px);animation:rise 1.1s cubic-bezier(.22,.7,.2,1) forwards}
.d1{animation-delay:.1s}.d2{animation-delay:.35s}.d3{animation-delay:.55s}.d4{animation-delay:.75s}.d5{animation-delay:.95s}
@keyframes rise{to{opacity:1;transform:none}}
@media (max-width:480px){.sheet{padding:44px 26px 38px}.frame{inset:12px}.base{gap:14px}}
@media (prefers-reduced-motion:reduce){.an{opacity:1;transform:none;animation:none}.dot{animation:none}}
</style>
</head>
<body>
<div class="frame"></div>
<div class="sheet">
  <div class="top an d1"><span class="cap">By introduction</span><a href="/careers" class="cap lnk">Careers →</a></div>
  <div class="core">
    <h1 class="word an d2">Nifty</h1>
    <span class="sub an d2">Collectibles · Est. MMXXI</span>
    <div class="rule an d3"></div>
    <p class="line an d3">Pieces, placed privately.<br>Provenance first.</p>
    <span class="hex an d4">0x4e69667479</span>
    <div class="door an d4" id="door"><input id="mail" placeholder="address" aria-label="Email or Telegram"><button id="go" aria-label="Send">→</button></div>
    <div class="done" id="done">Received</div>
    <noscript><p class="cap" style="margin-top:20px"><a href="mailto:office@niftyinc.io">office@niftyinc.io</a></p></noscript>
  </div>
  <div class="base an d5">
    <div><span class="cap">Enquiries</span><a href="mailto:office@niftyinc.io" class="v">office@niftyinc.io</a></div>
    <div class="r"><span class="cap">Block</span><span class="v mono blk"><span class="dot"></span><span id="blk">24,318,407</span></span></div>
    <div class="r"><span class="cap">London W1</span><span class="v mono" id="t">--:--</span></div>
  </div>
</div>
<script>
function tick(){document.getElementById('t').textContent=new Date().toLocaleTimeString('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',hour12:false})}
tick();setInterval(tick,15000);
var b=24318407;setInterval(function(){b++;document.getElementById('blk').textContent=b.toLocaleString('en-GB')},12000);
document.getElementById('go').onclick=function(){
  var v=document.getElementById('mail').value.trim();
  if(!v)return document.getElementById('mail').focus();
  if(v.charAt(0)==='@'){window.open('https://t.me/'+v.slice(1),'_blank')}
  else{location.href='mailto:office@niftyinc.io?subject=Enquiry&body='+encodeURIComponent('Address: '+v+'\n\n')}
  document.getElementById('door').classList.add('off');document.getElementById('done').classList.add('on');
};
document.getElementById('mail').onkeydown=function(e){if(e.key==='Enter')document.getElementById('go').click()};
</script>
</body>
</html>
